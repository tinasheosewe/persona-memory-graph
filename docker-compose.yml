version: "3.9"

services:
  api:
    build: .
    image: character-kg-api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://kg:kgpass@db:5432/kg}
      PORT: ${PORT:-8000}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USER: ${NEO4J_USER:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kg
      POSTGRES_PASSWORD: kgpass
      POSTGRES_DB: kg
    ports:
      - "5432:5432"
    volumes:
      - kg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.23
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/kgneo4jpass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - kg-neo4j-data:/data
    restart: unless-stopped

volumes:
  kg-db-data:
  kg-neo4j-data:
