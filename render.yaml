services:
  - type: web
    name: character-kg-api
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    buildFilter:
      paths:
        include:
          - app/**
          - kg/**
          - requirements.txt
          - render.yaml
        exclude:
          - test_files/**
          - scripts/**
          - docs/**
          - tests/**
          - .env
          - .env.example
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: character-kg-db
          property: connectionString
      - key: LLM_MODEL
        value: gpt-4o-mini
      # Set this manually in the Render dashboard for production LLM calls.
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: character-kg-db
    plan: starter
